name: Publish CLI

# Publishes `@dynjandi/cli` to npm when the `version` in packages/cli/package.json is one the registry does
# not hold, then tags the commit and cuts a GitHub release. The registry is the gate, not a diff base: a
# re-run, a push that touches the package without bumping it, or a run that follows a publish whose sibling
# jobs failed all find the version already on npm and stop green. It is publish.yml's flow for a second
# package, in its own file on purpose (see below).
#
# THE FILE NAME IS LOAD-BEARING. The npm trusted publisher for this package names `publish-cli.yml`, and npm
# trusts *any* run of that file, so every job refuses every ref but `refs/heads/main`. That check stops
# accidental runs; it does not stop someone with push access, because it is only as strong as the copy of
# this file being run. Renaming or moving this file breaks publishing until the setting on npmjs.com is
# changed (its fields cannot be edited, only deleted and re-created). It is not folded into publish.yml,
# whose own file name is what the SDK's trusted publisher trusts: a second package there would put the SDK's
# working flow at risk.
#
# Jobs, in order, each only when there is something to publish:
#   check       reads the version and asks the registry. No OIDC permission.
#   smoke       the live smoke test (smoke.yml), called the way publish.yml calls it: with the one secret it
#               declares (`workflow_call` in smoke.yml requires DYNJANDI_SMOKE_PROJECT_KEY, so it is passed
#               by name, not with `secrets: inherit`). It runs the SDK's smoke test and then the CLI's
#               contract suite, the spec's statuses, messages and shapes checked against the service.
#   management  the management API's published document (management-api.yml, `workflow_call`, no secret):
#               what `dynjandi setup` calls must still be in it. A precondition, not a courtesy: a published
#               version is permanent, so a drifted service or dashboard blocks it.
#   build       installs, builds, tests the CLI and packs, and hands the tarball over as an artifact. No OIDC
#               permission.
#   publish     `id-token: write`, and nothing else: it installs nothing, has no cache and no checkout, and
#               only runs `npm publish <tarball>`. A compromised dependency can therefore not request an npm
#               OIDC token, because no dependency's code runs in the job that can.
#   release     `contents: write`, and no OIDC permission: tags the commit `cli-v<version>` and cuts a GitHub
#               release. It runs no dependency code either; it is `gh` and nothing else.
#
# No token exists anywhere: npm exchanges the publish job's OIDC token for a short-lived credential.
# Provenance is generated by npm itself for a trusted publish from a public repository of a public package
# (docs.npmjs.com/trusted-publishers, "Automatic provenance generation"); `--provenance` is passed anyway so
# that a publish that cannot produce it fails instead of shipping without it. It needs `repository.url` in
# package.json to match this repository.
#
# The first version is published by hand, because a trusted publisher can only be configured for a package
# that already exists. See context/release.md, "How the CLI is published".

on:
  push:
    branches: [main]
    paths:
      - packages/cli/**
      - pnpm-lock.yaml
      - LICENSE
      - .github/workflows/publish-cli.yml

# Nothing else publishes this package, so two runs never race; a queued run waits and then finds the version
# published.
concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the registry
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the registry
        id: registry
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/cli/package.json)"
          # Plain x.y.z only: the version becomes a tag name and a file name below, and npm refuses a
          # prerelease published without an explicit --tag.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packages/cli/package.json version '${version}' is not a plain x.y.z version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # 0.0.0 is the unreleased placeholder, not a version: the first version is published by hand, so a
          # run before it must never publish, even once the trusted publisher exists.
          if [ "$version" = "0.0.0" ]; then
            echo "::notice::@dynjandi/cli is at 0.0.0, the unreleased placeholder; its first version is published by hand."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(npm view "@dynjandi/cli@${version}" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::@dynjandi/cli@${version} is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Live smoke test
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    secrets:
      DYNJANDI_SMOKE_PROJECT_KEY: ${{ secrets.DYNJANDI_SMOKE_PROJECT_KEY }}

  management:
    name: Management API document
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/management-api.yml

  build:
    name: Build and pack
    runs-on: ubuntu-latest
    needs: [check, smoke, management]
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The CLI's tests only: this workflow publishes the CLI, and the picker's browser tests need a Chromium
      # this job does not install (ci.yml runs them). `build` and `check:package` above and below still cover
      # every package. `test` is the offline suite; the live and management checks ran as preconditions.
      - run: pnpm --filter @dynjandi/cli run test
      - run: pnpm check:package

      # `pnpm pack` runs the package's `prepack` (build, then the root LICENSE copied in) and rewrites any
      # `workspace:` specifier, which `npm pack` would not. It runs from the package directory.
      - name: Pack the CLI
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 24 bundles a new enough npm; the
      # guard below fails loudly rather than letting a publish fall back to a missing credential. No cache
      # and no checkout: this job installs and runs nothing but npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm with trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          need="11.5.1"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n 1)" != "$need" ]; then
            echo "::error::npm ${have} cannot publish over OIDC; trusted publishing needs npm >= ${need}."
            exit 1
          fi
          echo "npm ${have}"

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/pack

      - name: Publish to npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Checked again here: the registry may have moved while `build` ran.
          if [ "$(npm view "@dynjandi/cli@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@dynjandi/cli@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "$RUNNER_TEMP/pack/dynjandi-cli-${VERSION}.tgz" --access public --provenance

  # Only after a successful publish (a skipped or failed `publish` skips this). The tag is `cli-v<version>`,
  # distinct from the SDK's `sdk-v<version>`, with no `/`.
  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v${VERSION}"
          # Idempotent: a re-run, or a release made by hand, must not fail the job.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists; nothing to do."
            exit 0
          fi
          # Creates the tag at the commit this run is for when it does not exist yet.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "@dynjandi/cli ${VERSION}" \
            --notes "Published to npm as [@dynjandi/cli@${VERSION}](https://www.npmjs.com/package/@dynjandi/cli/v/${VERSION})."
