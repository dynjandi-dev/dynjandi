name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('./packages/focal-picker/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # A cache hit restores the browser but not the system libraries it needs, so those are installed either way.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dynjandi/focal-picker exec playwright install --with-deps --only-shell chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @dynjandi/focal-picker exec playwright install-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm test
      - run: pnpm check:generated
