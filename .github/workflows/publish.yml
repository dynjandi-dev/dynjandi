name: Publish SDK

# Publishes `@dynjandi/sdk` to npm when the `version` in packages/sdk/package.json is one the registry does
# not hold, then tags the commit and cuts a GitHub release. The registry is the gate, not a diff base: a
# re-run, a push that touches the package without bumping it, or a run that follows a publish whose sibling
# jobs failed all find the version already on npm and stop green.
#
# THE FILE NAME IS LOAD-BEARING. The npm trusted publisher for this package names `publish.yml`, and npm
# trusts *any* run of that file, so every job refuses every ref but `refs/heads/main`. That check stops
# accidental runs; it does not stop someone with push access, because it is only as strong as the copy of
# this file being run. Renaming or moving this file breaks publishing until the setting on npmjs.com is
# changed (its fields cannot be edited, only deleted and re-created).
#
# Jobs, in order, each only when there is something to publish:
#   check    reads the version and asks the registry. No OIDC permission.
#   smoke    the live smoke test (smoke.yml) against the real service. A precondition, not a courtesy: a
#            published version is permanent, so a spec that has drifted from the service blocks it.
#   build    installs, builds, tests and packs, and hands the tarball over as an artifact. No OIDC permission.
#   publish  `id-token: write`, and nothing else: it installs nothing, has no cache and no checkout, and only
#            runs `npm publish <tarball>`. A compromised dependency can therefore not request an npm OIDC
#            token, because no dependency's code runs in the job that can.
#   release  `contents: write`, and no OIDC permission: tags the commit `sdk-v<version>` and cuts a GitHub
#            release. It runs no dependency code either; it is `gh` and nothing else.
#
# No token exists anywhere: npm exchanges the publish job's OIDC token for a short-lived credential.
# Provenance is generated by npm itself for a trusted publish from a public repository of a public package
# (docs.npmjs.com/trusted-publishers, "Automatic provenance generation"); `--provenance` is passed anyway so
# that a publish that cannot produce it fails instead of shipping without it. It needs `repository.url` in
# package.json to match this repository.
#
# `0.1.0` is published by hand, because a trusted publisher can only be configured for a package that
# already exists. See context/release.md, "How the SDK is published".

on:
  push:
    branches: [main]
    paths:
      - packages/sdk/**
      - pnpm-lock.yaml
      - LICENSE
      - .github/workflows/publish.yml

# Nothing else publishes, so two runs never race; a queued run waits and then finds the version published.
concurrency:
  group: publish-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the registry
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the registry
        id: registry
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/sdk/package.json)"
          # Plain x.y.z only: the version becomes a tag name and a file name below, and npm refuses a
          # prerelease published without an explicit --tag.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packages/sdk/package.json version '${version}' is not a plain x.y.z version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "@dynjandi/sdk@${version}" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::@dynjandi/sdk@${version} is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Live smoke test
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    secrets:
      DYNJANDI_SMOKE_PUBLIC_KEY: ${{ secrets.DYNJANDI_SMOKE_PUBLIC_KEY }}

  build:
    name: Build and pack
    runs-on: ubuntu-latest
    needs: [check, smoke]
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:package

      # `pnpm pack` runs the package's `prepack` (build, then the root LICENSE copied in) and rewrites any
      # `workspace:` specifier, which `npm pack` would not. It runs from the package directory.
      - name: Pack the SDK
        working-directory: packages/sdk
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 24 bundles a new enough npm; the
      # guard below fails loudly rather than letting a publish fall back to a missing credential. No cache
      # and no checkout: this job installs and runs nothing but npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm with trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          need="11.5.1"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n 1)" != "$need" ]; then
            echo "::error::npm ${have} cannot publish over OIDC; trusted publishing needs npm >= ${need}."
            exit 1
          fi
          echo "npm ${have}"

      - uses: actions/download-artifact@v8
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pack

      - name: Publish to npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Checked again here: the registry may have moved while `build` ran.
          if [ "$(npm view "@dynjandi/sdk@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@dynjandi/sdk@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "$RUNNER_TEMP/pack/dynjandi-sdk-${VERSION}.tgz" --access public --provenance

  # Only after a successful publish (a skipped or failed `publish` skips this). The tag is `sdk-v<version>`,
  # with no `/`, so it is safe inside a raw.githubusercontent.com URL: the spec's versioned URL is
  # https://raw.githubusercontent.com/dynjandi-dev/dynjandi/sdk-v<version>/packages/spec/openapi.yaml.
  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    needs: [check, publish]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="sdk-v${VERSION}"
          # Idempotent: a re-run, or a release made by hand, must not fail the job.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists; nothing to do."
            exit 0
          fi
          # Creates the tag at the commit this run is for when it does not exist yet.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "@dynjandi/sdk ${VERSION}" \
            --notes "Published to npm as [@dynjandi/sdk@${VERSION}](https://www.npmjs.com/package/@dynjandi/sdk/v/${VERSION}). The OpenAPI spec at this release: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/packages/spec/openapi.yaml"
